prompt.prompt = """Which playbook converges the current topology on kind?"""
prompt.distractors = [
  "`automation/development/noetl.yaml action=redeploy`.",
  "`kubectl apply -f ci/manifests/noetl/`.",
  "`helm install noetl`.",
]
answer.answer = "`automation/ehdb/ehdb_platform.yaml` with `profile=kind`."
context = """The older playbook builds the Python image and applies NATS."""
