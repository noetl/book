[[questions]]
type = "MultipleChoice"
prompt.prompt = "An inclusive router takes arcs to `a` and `b`. How do they run locally?"
prompt.distractors = ["In parallel threads.", "Only `a` runs.", "In parallel worker slots."]
answer.answer = "One after another, in the CLI process."
context = "The local interpreter calls each taken target in turn; there are no workers or slots."
