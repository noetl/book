[[questions]]
type = "MultipleChoice"
prompt.prompt = """A writer pod restarts. Roughly how long until a new writer holds the lease, at the defaults?"""
prompt.distractors = [
  "Instantly: the same pod keeps its lease.",
  "5 minutes, the KEDA cooldown.",
  "It never does without an operator.",
]
answer.answer = "About 21 s: lease 15 s + renew 5 s + 1."
context = """The holder identity includes a random id, so a restarted pod waits out the old lease."""
id = "0bf7018e-0b1a-4a0e-9d87-902c97293fe6"

