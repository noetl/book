# Chapter 1.2: hello, with an input. The first step runs a shell command (local
# runtime field `cmds:`), the second a Rhai expression.
apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: hello
workload:
  who: world
workflow:
  - step: start
    tool:
      kind: shell
      cmds:
        - echo "hello {{ workload.who }}"
    next:
      - step: done
  - step: done
    tool:
      kind: rhai
      code: |
        40 + 2
