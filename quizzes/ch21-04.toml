[[questions]]
type = "MultipleChoice"
prompt.prompt = """A user pool has 8 slots. Eight parent executions each await a child with `return_result: true`, all on that pool. What happens?"""
prompt.distractors = [
  "KEDA adds replicas first, so it always resolves.",
  "The children run on the system pool.",
  "The server detects the cycle and fails the parents at once.",
]
answer.answer = "The parents hold all 8 slots, no child can start, and each parent waits until its await times out."
context = """The model's deadlock note on `kind: playbook`. KEDA may add capacity, but it scales on waiting commands, and nothing guarantees it before the awaits time out."""
id = "fd138d51-3c26-4ae8-89c8-9c13168d2771"

