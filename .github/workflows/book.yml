name: book

# T-01 (#3): build the book and check its links on every PR and on main.
# External links are checked on a weekly schedule only, so a flaky
# third-party site can never block a PR.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC: external-link sweep
  workflow_dispatch:

permissions:
  contents: read

env:
  MDBOOK_VERSION: "0.4.40"
  LINKCHECK_VERSION: "0.7.7"
  QUIZ_VERSION: "0.3.12"      # last mdbook-quiz built against mdbook 0.4.x without a version warning
  ADMONISH_VERSION: "1.20.0"  # writes assets_version 3.0.3 (book.toml)

jobs:
  build:
    name: mdbook build + linkcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned mdbook + preprocessors (release binaries)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -sSfL -o /tmp/linkcheck.zip \
            "https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v${LINKCHECK_VERSION}/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip"
          unzip -o -q /tmp/linkcheck.zip -d "$HOME/.local/bin"
          curl -sSfL "https://github.com/cognitive-engineering-lab/mdbook-quiz/releases/download/v${QUIZ_VERSION}/mdbook-quiz_x86_64-unknown-linux-gnu_bare.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -sSfL "https://github.com/tommilligan/mdbook-admonish/releases/download/v${ADMONISH_VERSION}/mdbook-admonish-v${ADMONISH_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/"mdbook*
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          mdbook --version
          mdbook-linkcheck --version
          mdbook-quiz --version
          mdbook-admonish --version

      - name: Enable external links (scheduled / manual runs only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: echo "MDBOOK_OUTPUT__LINKCHECK__FOLLOW_WEB_LINKS=true" >> "$GITHUB_ENV"

      - name: mdbook build (html + linkcheck)
        run: mdbook build

      - name: Upload rendered book
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-html
          path: book/html
          if-no-files-found: ignore
          retention-days: 7

  examples:
    name: example playbooks (noetl run, pinned CLI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned NoETL CLI (release tarball, sha256-checked)
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' < examples/NOETL_CLI_VERSION)"
          T="noetl-v${V}-linux-x86_64.tar.gz"
          cd /tmp
          curl -sSfLO "https://github.com/noetl/cli/releases/download/v${V}/${T}"
          curl -sSfLO "https://github.com/noetl/cli/releases/download/v${V}/checksums.txt"
          # checksums.txt lists paths as dist/<dir>/<file>; check by basename.
          SUM="$(grep "/${T}\$" checksums.txt | cut -d' ' -f1)"
          test -n "$SUM"
          echo "${SUM}  ${T}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$T" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: CLI version (cited by Appendix E)
        run: noetl --version

      - name: Run every example and diff against its expected output
        run: tools/run-examples.sh examples

  appendices:
    name: generated appendices fresh + examples match the schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned server commit
        run: cat tools/SERVER_SCHEMA_PIN
      - name: Regenerate Appendices A-D at the pin
        run: python3 tools/gen-appendices.py --fetch
      - name: Every example playbook validates against the pinned schema
        run: |
          python -m pip install --quiet jsonschema==4.24.0 pyyaml==6.0.2
          python tools/validate-examples.py examples .schema-cache/playbook.schema.json
      - name: Committed pages must equal the regenerated ones
        run: |
          if ! git diff --exit-code -- src/appendix-01-dsl-reference.md src/appendix-02-tool-kinds.md src/appendix-03-flags.md src/appendix-04-resource-model.md; then
            echo "::error title=stale appendix::Appendices A-D differ from what tools/gen-appendices.py produces at the pin. Run: python3 tools/gen-appendices.py --fetch, and commit the result."
            exit 1
          fi
