[[questions]]
type = "MultipleChoice"
prompt.prompt = """What does `profile=kind` guard against?"""
prompt.distractors = [
  "Running without network access.",
  "Running as root.",
  "Nothing; it only sets defaults.",
]
answer.answer = "Running against any context that is not `kind-*`."
context = """`profile=prod` refuses a `kind-*` context in turn."""
