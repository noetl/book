[[questions]]
type = "MultipleChoice"
prompt.prompt = "Your active context sets `runtime: distributed`. You run `noetl run job.yaml -r auto`. Where does it run?"
prompt.distractors = ["Locally, because auto prefers local.", "It asks you.", "It fails: auto is invalid with a context."]
answer.answer = "Distributed: `auto` counts as no flag, so the context's runtime wins."
context = "The ladder is flag (unless auto) → context (unless auto/unset) → local (`resolve_runtime`, CLI v6.4.0)."
id = "9fae62df-8e5f-43f6-977f-338e30ad3056"

[[questions]]
type = "MultipleChoice"
prompt.prompt = "A playbook 'works locally'. What has that shown?"
prompt.distractors = [
  "That it will work on a server too.",
  "That its tool kinds exist on the server.",
  "That the server's validator accepts it.",
]
answer.answer = "Only that the local runtime runs it; several local differences fail silently."
context = "The local runtime is a separate implementation (Ch. 8.1 lists the differences)."
id = "d6c9f060-2145-4eae-8af5-5c81b2a27ed9"
