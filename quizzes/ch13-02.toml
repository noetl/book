[[questions]]
type = "MultipleChoice"
prompt.prompt = """The bus writers use group commit. What does that change?"""
prompt.distractors = [
  "The crash window: some acknowledged records may be lost.",
  "Nothing: every record still gets its own `fsync`.",
  "Durability moves to the reader.",
]
answer.answer = "The cost: records that arrive together share one `fsync`, and none is acknowledged before it."
context = """`FlushPolicy` group-commit posture, `part.rs:33-50`."""
id = "fb5e9d4c-c0bc-4e73-a024-1133d2708464"
