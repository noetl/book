[[questions]]
type = "MultipleChoice"
prompt.prompt = """A writer pod restarts. Roughly how long until a new writer holds the lease, at the defaults?"""
prompt.distractors = [
  "Instantly: the same pod keeps its lease.",
  "5 minutes, the KEDA cooldown.",
  "It never does without an operator.",
]
answer.answer = "About 21 s: lease 15 s + renew 5 s + 1."
context = """The holder identity includes a random id, so a restarted pod waits out the old lease."""
id = "0bf7018e-0b1a-4a0e-9d87-902c97293fe6"

[[questions]]
type = "MultipleChoice"
prompt.prompt = """What mode does the EHDB fence run in on prod, per the dated record?"""
prompt.distractors = [
  "Off, because worker v6.15.0 says enforce was not armed.",
  "It is permanently off; fencing was removed.",
  "It runs in shadow, per the 2026-11-04 Home page.",
]
answer.answer = "Enforce, armed: `ehdb_engine_fence_active` 2 on both buses, fence epoch = election epoch (read 2026-11-16)."
context = """Read off the writer on 2026-11-16 (writer worker 6.11.9). The v6.15.0 note is code history, not a cluster reading."""
id = "ca8b0217-22a4-4d71-9801-78600bd8cbf5"
