# Chapter 6.5 (local, CLI 6.4.0): a failing step stops the run; `after` never runs,
# and `spec.on_error: continue` changes nothing.
apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: failure_local
workflow:
  - step: start
    spec:
      on_error: continue
    tool:
      kind: rhai
      code: |
        throw "boom";
    next:
      - step: after
  - step: after
    tool:
      kind: rhai
      code: |
        "after"
