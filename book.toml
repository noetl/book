[book]
title = "The NoETL Book"
description = "Declarative, event-sourced orchestration: the NoETL ecosystem from first playbook to distributed, edge and agent runtimes."
authors = ["The NoETL contributors"]
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "book"
create-missing = false   # SUMMARY.md is the contract; a missing file is a build error, not a silent stub

[output.html]
git-repository-url = "https://github.com/noetl/book"
edit-url-template = "https://github.com/noetl/book/edit/main/{path}"
additional-css = ["theme/status.css", "./mdbook-admonish.css", "theme/mdbook-admonish-custom.css"]
mathjax-support = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true

# ---------------------------------------------------------------------------
# Interactive preprocessors — PLANNED, not yet enabled.
#
# They are commented out so a plain `mdbook build` works today with only
# mdbook installed. Each is enabled in the same PR that adds its first real
# use (a quiz file, a diagram, a trace) and adds the binary to CI.
# See docs/BOOK-PLAN.md §4 "Interactive tooling".
# ---------------------------------------------------------------------------

# Brown CEL's quiz plugin (T-03, #5): {{#quiz ../quizzes/<file>.toml}}
# No telemetry is configured: answers stay in the reader's browser
# (cache-answers = localStorage only). See wiki Decisions.
[preprocessor.quiz]
fullscreen = false
cache-answers = true

# Mermaid diagrams for architecture and flow figures.
# [preprocessor.mermaid]
# command = "mdbook-mermaid"

# Callouts (T-03, #5). Built-ins (note, tip, warning, ...) plus three book
# types: `myth` (a common belief that is wrong, and the fact), `not-yet`
# (a TARGET subject: designed, not built) and `partial` (built, but off by
# default or only partly real). See Appendix H for when to use each.
[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`
after = ["links"]

[[preprocessor.admonish.custom]]
directive = "myth"
icon = "./theme/admonish/myth.svg"
color = "#c0392b"
title = "Myth"

[[preprocessor.admonish.custom]]
directive = "not-yet"
icon = "./theme/admonish/not-yet.svg"
color = "#7f8c8d"
title = "Not built yet (TARGET)"

[[preprocessor.admonish.custom]]
directive = "partial"
icon = "./theme/admonish/partial.svg"
color = "#d68910"
title = "Partial"

[preprocessor.admonish.renderer.test]
render_mode = "strip"

# NoETL-specific (to be built in this repo under tools/):
#   mdbook-noetl-trace  — renders a recorded event log as a step-through
#                         state visualization ({{#trace ../traces/<file>.json}})
#   mdbook-noetl-play   — embeds a runnable playbook backed by the WASM
#                         local runner ({{#playbook ../examples/<file>.yaml}})
# [preprocessor.noetl-trace]
# [preprocessor.noetl-play]

# Link checking (T-01, #3). Internal links on every build; external links
# only on the weekly CI schedule (MDBOOK_OUTPUT__LINKCHECK__FOLLOW_WEB_LINKS).
# `optional = true` lets a local `mdbook build` still work without the
# binary installed; CI always installs it, so CI never skips the check.
[output.linkcheck]
optional = true
follow-web-links = false
warning-policy = "error"
exclude = ['^https://github\.com/noetl/book/edit/']
