[[questions]]
type = "MultipleChoice"
prompt.prompt = """When does the active part seal, at the defaults?"""
prompt.distractors = [
  "Every 60 seconds.",
  "When the process shuts down.",
  "Never: EHDB keeps one file per store.",
]
answer.answer = "At 8 MiB or 1024 records, whichever comes first (age only if configured)."
context = """`DEFAULT_SEAL_MAX_BYTES` and `DEFAULT_SEAL_MAX_RECORDS`, `engine.rs:65-67`."""
