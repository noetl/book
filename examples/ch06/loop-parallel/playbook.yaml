# Chapter 6.3: a parallel loop. The server dispatches ALL items at once;
# max_in_flight is parsed but nothing reads it (server v3.161.2).
apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: loop_parallel
workload:
  cities: [Lisbon, Oslo, Quito]
workflow:
  - step: start
    loop:
      in: "{{ workload.cities }}"
      iterator: city
      spec:
        mode: parallel
        max_in_flight: 1              # no effect: all three are dispatched together
    tool:
      kind: python
      args:
        city: "{{ iter.city }}"       # also {{ city }}, {{ iter._index }}, {{ iter._total }}
      code: |
        result = {"city": args["city"], "len": len(args["city"])}
    next:
      - step: summarize
  - step: summarize                   # here {{ start }} is the loop's result: a list
    tool: { kind: noop }
